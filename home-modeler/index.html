<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lotline</title>
  <meta name="description" content="Try four home styles on four kinds of property lots in 3D, with an animated build between styles." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Lets scripts import "three" and its add-ons by name. -->
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <main class="app">
    <canvas id="scene" aria-label="3D view of the selected home on the selected lot. Drag to orbit, scroll or pinch to zoom, arrow keys to turn."></canvas>

    <section class="panel controls" aria-label="Choose a home style and a lot">
      <header class="brand">
        <h1>Lotline</h1>
        <p>Try a home style on a lot</p>
      </header>

      <div class="tabs" role="tablist" aria-label="Panels">
        <button type="button" role="tab" id="tab-choose" aria-selected="true" aria-controls="pane-choose">Style &amp; lot</button>
        <button type="button" role="tab" id="tab-custom" aria-selected="false" aria-controls="pane-custom">Customize</button>
      </div>

      <div class="pane" id="pane-choose" role="tabpanel" aria-labelledby="tab-choose">
      <fieldset>
        <legend>Home style</legend>
        <div class="options" id="style-options">
          <button type="button" class="opt" data-style="modern" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h20M3.5 20v-8h11v8M7 12V5.5h13V20M10 9h7M6 15.5h5"/></svg>
            <span>Modern</span>
          </button>
          <button type="button" class="opt" data-style="craftsman" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12 12 6l10.5 6M4 11v9h16v-9M2 20h20M6 20v-5M11 20v-5M8.5 12.5 12 10.5l3.5 2"/></svg>
            <span>Craftsman</span>
          </button>
          <button type="button" class="opt" data-style="farmhouse" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 20v-9L12 3.5l7.5 7.5v9M2 20h20M5 7V3.5M19 7V3.5M3 14h18M10.5 20v-4h3v4"/></svg>
            <span>Colonial Farmhouse</span>
          </button>
          <button type="button" class="opt" data-style="mediterranean" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h20M3.5 20V8.5L5.75 6 8 8.5V20M8 12.5l2-2h9.5l2 2M9 12.5V20M20.5 12.5V20M13 20v-3a1.75 1.75 0 0 1 3.5 0v3"/></svg>
            <span>Mediterranean</span>
          </button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Property lot</legend>
        <div class="options" id="lot-options">
          <button type="button" class="opt" data-lot="beach" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 19.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M17 11a3.5 3.5 0 1 0-7 0"/></svg>
            <span>Beachfront</span>
          </button>
          <button type="button" class="opt" data-lot="mountain" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 20 9 7l4.5 7.5L16 11l6.5 9zM7.2 10.2 9 11.5l1.6-1.4"/></svg>
            <span>Mountain hillside</span>
          </button>
          <button type="button" class="opt" data-lot="suburban" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h20M3.5 20v-7.5l5-4 5 4V20M7 20v-4h3v4M18 20v-4.5M18 15.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
            <span>Suburban street</span>
          </button>
          <button type="button" class="opt" data-lot="desert" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20.5h20M11 20.5V5a2 2 0 0 1 4 0v15.5M11 13H8.5a2 2 0 0 1-2-2V8M15 10.5h1.5a2 2 0 0 0 2-2V6.5"/></svg>
            <span>Desert</span>
          </button>
        </div>
      </fieldset>
      </div>

      <div class="pane" id="pane-custom" role="tabpanel" aria-labelledby="tab-custom" hidden>
        <div id="custom-host"></div>
      </div>

      <div class="panel-foot">
        <label class="quality" for="quality">
          <input type="checkbox" id="quality" />
          <span class="quality-text">High quality <small>Soft shading in corners, sharper shadows, denser grass. Best on a strong computer.</small></span>
        </label>
        <p class="hint">Drag to orbit · Scroll or pinch to zoom</p>
      </div>
    </section>

    <details class="panel titleblock" id="titleblock" open>
      <summary>
        <span class="tb-kicker">Example plan</span>
        <span class="tb-title" id="tb-title">Modern</span>
        <span class="tb-sub" id="tb-sub">on a beachfront lot</span>
      </summary>
      <dl class="tb-grid">
        <div><dt>Era</dt><dd id="tb-era"></dd></div>
        <div><dt>Stories</dt><dd id="tb-stories"></dd></div>
        <div><dt>Plan</dt><dd id="tb-plan"></dd></div>
        <div><dt>Footprint</dt><dd id="tb-footprint"></dd></div>
        <div class="wide"><dt>Roof</dt><dd id="tb-roof"></dd></div>
        <div class="wide"><dt>Exterior</dt><dd id="tb-exterior"></dd></div>
        <div class="wide"><dt>Features</dt><dd id="tb-features"></dd></div>
        <div><dt>Lot size</dt><dd id="tb-size"></dd></div>
        <div><dt>Grade</dt><dd id="tb-grade"></dd></div>
        <div class="wide flag"><dt>Foundation</dt><dd id="tb-foundation"></dd></div>
      </dl>
    </details>

    <div class="veil" id="veil" aria-hidden="true"></div>
    <p class="status" id="status" role="status">Loading the 3D engine…</p>
  </main>

  <script src="js/util.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/houses.js"></script>
  <script src="js/lots.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/options.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
